# ══════════════════════════════════════════════════════════════════════
# victor-201.github.io — CI / CD Pipeline
# Standard: devops.skill.md Section 9
#
# Triggers:
#   • Every PR → quality gate (lint + build)
#   • Push to main → quality gate → deploy to Cloudflare Pages
#   • Manual dispatch → rollback job available
# ══════════════════════════════════════════════════════════════════════

name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: Quality gate ──────────────────────────────────────────
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint
        continue-on-error: true

      - name: Type-check + Build
        # tsc -b && vite build — both run inside `yarn build`
        run: yarn build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Step 2: Deploy to Cloudflare Pages & gh-pages branch (main only) ──
  deploy:
    name: Deploy → Cloudflare Pages & gh-pages
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name victorfolio --commit-dirty=true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Verify deployment
        run: |
          echo "✅ Deployment complete. Updated Cloudflare Pages victorfolio and gh-pages branch."

  # ── Step 3: Rollback (manual trigger only) ────────────────────────
  rollback:
    name: Rollback (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Instructions
        run: |
          echo "To rollback: go to Cloudflare Pages dashboard → Deployments → find previous deployment → click 'Rollback to this deployment'."
          echo "Or re-run the deploy job with the previous commit SHA."
